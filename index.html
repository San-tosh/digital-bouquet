<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Bouquet for Angky 🌸</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Quicksand:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100dvh;
    overflow: hidden;
    font-family: "Quicksand", system-ui, sans-serif;
    background: linear-gradient(180deg,
      #171033 0%, #2a1b4e 34%, #46296b 58%, #7c4479 78%, #c987a1 100%);
  }

  /* ---------- twinkling stars (created by JS) ---------- */
  .star {
    position: fixed;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
    animation: twinkle var(--d, 3s) ease-in-out var(--delay, 0s) infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(.6); }
    50%      { opacity: var(--o, .9); transform: scale(1); }
  }

  /* ---------- drifting petals (created by JS) ---------- */
  .petal {
    position: fixed;
    top: -4vh;
    width: 14px; height: 14px;
    background: var(--c, rgba(255, 183, 205, .85));
    border-radius: 150% 0 150% 0;
    animation: fall var(--d, 11s) linear var(--delay, 0s) infinite;
  }
  @keyframes fall {
    0%   { transform: translate(0, 0) rotate(0deg); }
    25%  { transform: translate(4vw, 28vh) rotate(160deg); }
    50%  { transform: translate(-3vw, 55vh) rotate(300deg); }
    75%  { transform: translate(3vw, 82vh) rotate(460deg); }
    100% { transform: translate(-2vw, 110vh) rotate(620deg); }
  }

  /* ---------- layout ---------- */
  .scene {
    position: relative;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vmin, 20px);
    padding: 24px 20px 40px;
    text-align: center;
  }
  svg.bouquet {
    width: min(74vmin, 400px);
    height: auto;
    filter: drop-shadow(0 8px 24px rgba(20, 8, 40, .55));
  }

  /* gentle sway of the whole bouquet once bloomed */
  .play svg.bouquet {
    animation: sway 6s ease-in-out 3.6s infinite;
    transform-origin: 50% 95%;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(1.4deg); }
  }

  /* ---------- bloom sequence ---------- */
  .stem {
    fill: none;
    stroke-linecap: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
  }
  .play .stem { animation: grow 1.7s ease-out .25s forwards; }
  @keyframes grow { to { stroke-dashoffset: 0; } }

  .leaf, .flower, .breath {
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(0);
  }
  .play .leaf   { animation: pop .7s cubic-bezier(.34, 1.55, .64, 1) var(--bd, 1.1s) forwards; }
  .play .flower { animation: pop .8s cubic-bezier(.34, 1.55, .64, 1) var(--bd, 1.8s) forwards; }
  .play .breath { animation: pop .9s ease-out var(--bd, 3s) forwards; }
  @keyframes pop { to { transform: scale(1); } }

  .leaf:nth-of-type(2) { --bd: 1.25s; }
  .leaf:nth-of-type(3) { --bd: 1.4s; }
  .leaf:nth-of-type(4) { --bd: 1.5s; }

  .f2 { --bd: 2.05s; }
  .f3 { --bd: 2.3s; }
  .f4 { --bd: 2.55s; }
  .f5 { --bd: 2.8s; }

  .wrap-paper { opacity: 0; }
  .play .wrap-paper { animation: fadein .6s ease 1.5s forwards; }
  @keyframes fadein { to { opacity: 1; } }

  /* ---------- message ---------- */
  .msg {
    opacity: 0;
    max-width: 34rem;
  }
  .play .msg { animation: rise 1.2s ease 3.4s forwards; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg h1 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(2rem, 7.5vmin, 3.2rem);
    color: #ffd9e8;
    text-shadow: 0 0 26px rgba(255, 160, 200, .45);
    margin-bottom: .4em;
  }
  .msg p {
    color: #ecdcf7;
    font-size: clamp(.95rem, 3.4vmin, 1.15rem);
    line-height: 1.65;
  }

  .replay {
    margin-top: 6px;
    opacity: 0;
    background: rgba(255, 255, 255, .12);
    border: 1px solid rgba(255, 217, 232, .4);
    color: #ffd9e8;
    font-family: inherit;
    font-size: .85rem;
    padding: 8px 18px;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(4px);
  }
  .play .replay { animation: fadein .8s ease 4.4s forwards; }
  .replay:hover { background: rgba(255, 255, 255, .22); }

  /* ---------- reduced motion: show everything, skip the show ---------- */
  @media (prefers-reduced-motion: reduce) {
    .star, .petal, .play svg.bouquet { animation: none; }
    .star { opacity: .7; }
    .petal { display: none; }
    .play .stem, .play .leaf, .play .flower, .play .breath,
    .play .wrap-paper, .play .msg, .play .replay {
      animation-duration: .01s;
      animation-delay: 0s;
    }
  }
</style>
</head>
<body class="play">

<div class="scene">
  <svg class="bouquet" viewBox="0 0 420 520" role="img" aria-label="A bouquet of pastel flowers blooming for Angky">
    <!-- stems -->
    <g stroke="#5f9e6e" stroke-width="4.5">
      <path class="stem" pathLength="1" d="M210 498 C 206 380, 208 260, 210 158"/>
      <path class="stem" pathLength="1" d="M210 498 C 190 400, 158 300, 142 208"/>
      <path class="stem" pathLength="1" d="M210 498 C 228 400, 262 300, 282 202"/>
      <path class="stem" pathLength="1" d="M210 498 C 178 420, 128 350, 106 282"/>
      <path class="stem" pathLength="1" d="M210 498 C 240 420, 292 352, 316 286"/>
    </g>

    <!-- leaves -->
    <g fill="#6fb07e">
      <ellipse class="leaf" cx="182" cy="352" rx="9" ry="24" transform="rotate(35 182 352)"/>
      <ellipse class="leaf" cx="242" cy="360" rx="9" ry="24" transform="rotate(-32 242 360)"/>
      <ellipse class="leaf" cx="158" cy="300" rx="8" ry="20" transform="rotate(48 158 300)"/>
      <ellipse class="leaf" cx="270" cy="306" rx="8" ry="20" transform="rotate(-46 270 306)"/>
    </g>

    <!-- baby's breath clusters -->
    <g class="breath" fill="#fff" opacity=".9">
      <circle cx="176" cy="168" r="3"/><circle cx="188" cy="152" r="2.4"/>
      <circle cx="166" cy="150" r="2.2"/><circle cx="182" cy="138" r="2.6"/>
    </g>
    <g class="breath" fill="#fff" opacity=".9">
      <circle cx="248" cy="160" r="3"/><circle cx="260" cy="146" r="2.4"/>
      <circle cx="240" cy="142" r="2.2"/><circle cx="254" cy="130" r="2.6"/>
    </g>
    <g class="breath" fill="#fff" opacity=".9">
      <circle cx="118" cy="240" r="2.8"/><circle cx="106" cy="226" r="2.2"/>
      <circle cx="126" cy="222" r="2.4"/>
    </g>
    <g class="breath" fill="#fff" opacity=".9">
      <circle cx="306" cy="244" r="2.8"/><circle cx="320" cy="230" r="2.2"/>
      <circle cx="300" cy="226" r="2.4"/>
    </g>

    <!-- flowers: 6 petals rotated around a golden heart -->
    <defs>
      <g id="bloom">
        <ellipse cx="0" cy="-16" rx="9.5" ry="17" transform="rotate(0)"/>
        <ellipse cx="0" cy="-16" rx="9.5" ry="17" transform="rotate(60)"/>
        <ellipse cx="0" cy="-16" rx="9.5" ry="17" transform="rotate(120)"/>
        <ellipse cx="0" cy="-16" rx="9.5" ry="17" transform="rotate(180)"/>
        <ellipse cx="0" cy="-16" rx="9.5" ry="17" transform="rotate(240)"/>
        <ellipse cx="0" cy="-16" rx="9.5" ry="17" transform="rotate(300)"/>
      </g>
    </defs>

    <g class="flower f1" transform="translate(210 152)">
      <use href="#bloom" fill="#ff9ec3" opacity=".95"/>
      <use href="#bloom" fill="#ffc2d9" transform="scale(.62) rotate(30)"/>
      <circle r="8" fill="#ffd166"/>
    </g>
    <g class="flower f2" transform="translate(142 204)">
      <use href="#bloom" fill="#c3a6f2" opacity=".95"/>
      <use href="#bloom" fill="#e0cffb" transform="scale(.62) rotate(30)"/>
      <circle r="8" fill="#ffe08a"/>
    </g>
    <g class="flower f3" transform="translate(282 198)">
      <use href="#bloom" fill="#fff3e0" opacity=".95"/>
      <use href="#bloom" fill="#ffe1ef" transform="scale(.62) rotate(30)"/>
      <circle r="8" fill="#f4a259"/>
    </g>
    <g class="flower f4" transform="translate(106 280)">
      <use href="#bloom" fill="#f397b8" opacity=".95" transform="scale(.85)"/>
      <use href="#bloom" fill="#fbc6da" transform="scale(.53) rotate(30)"/>
      <circle r="7" fill="#ffd166"/>
    </g>
    <g class="flower f5" transform="translate(316 284)">
      <use href="#bloom" fill="#b79ced" opacity=".95" transform="scale(.85)"/>
      <use href="#bloom" fill="#dcc9f7" transform="scale(.53) rotate(30)"/>
      <circle r="7" fill="#ffe08a"/>
    </g>

    <!-- wrapping paper + ribbon -->
    <g class="wrap-paper">
      <path d="M150 396 L210 510 L270 396 L242 420 L210 400 L178 420 Z"
            fill="#f7d6e0" opacity=".92"/>
      <path d="M164 402 L210 510 L256 402 L232 424 L210 408 L188 424 Z"
            fill="#efb9cd" opacity=".9"/>
      <circle cx="210" cy="432" r="7" fill="#e58bad"/>
      <path d="M210 432 C 196 440, 192 452, 198 460 C 206 456, 210 446, 210 432
               C 224 440, 228 452, 222 460 C 214 456, 210 446, 210 432 Z"
            fill="#e58bad"/>
    </g>
  </svg>

  <!-- ✏️ EDIT YOUR MESSAGE HERE ------------------------------------------ -->
  <div class="msg">
    <h1>Happy Birthday, Angky! 🌸</h1>
    <p>
      Angky Angdembe — here's a bouquet that will never wilt,
      for a friend who makes every day a little brighter.
      Wishing you the happiest of birthdays and a year filled
      with everything you love. 💐
    </p>
  </div>
  <!-- --------------------------------------------------------------------- -->

  <button class="replay" type="button" onclick="replay()">🌷 bloom again</button>
</div>

<script>
  // scatter twinkling stars and drifting petals
  const PETAL_COLORS = ["rgba(255,183,205,.85)", "rgba(216,191,247,.85)", "rgba(255,224,236,.85)"];
  for (let i = 0; i < 70; i++) {
    const s = document.createElement("span");
    s.className = "star";
    const size = 1 + Math.random() * 2.2;
    s.style.cssText = `left:${Math.random() * 100}vw; top:${Math.random() * 100}vh;
      width:${size}px; height:${size}px;
      --d:${2 + Math.random() * 4}s; --delay:${Math.random() * 5}s; --o:${.4 + Math.random() * .6}`;
    document.body.appendChild(s);
  }
  for (let i = 0; i < 12; i++) {
    const p = document.createElement("span");
    p.className = "petal";
    p.style.cssText = `left:${Math.random() * 100}vw;
      --c:${PETAL_COLORS[i % PETAL_COLORS.length]};
      --d:${9 + Math.random() * 8}s; --delay:${Math.random() * 12}s;
      transform:scale(${.7 + Math.random() * .7})`;
    document.body.appendChild(p);
  }

  function replay() {
    document.body.classList.remove("play");
    void document.body.offsetWidth; // restart CSS animations
    document.body.classList.add("play");
  }
</script>
</body>
</html>
